<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carousel Prompt Studio V4</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #1a1a1a;
    background: radial-gradient(circle at top left, rgba(196,162,101,.18), transparent 34%), #f3eee6;
  }
  main {
    width: min(680px, calc(100vw - 32px));
    padding: 28px;
    border: 1px solid rgba(26,26,26,.12);
    border-radius: 22px;
    background: rgba(255,255,255,.72);
    box-shadow: 0 22px 60px rgba(32,20,8,.14);
    text-align: center;
  }
  h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: -.04em; }
  p { margin: 0; color: #736b60; line-height: 1.5; }
  .bar { height: 8px; margin-top: 20px; border-radius: 999px; background: rgba(26,26,26,.1); overflow: hidden; }
  .fill { height: 100%; width: 40%; border-radius: inherit; background: #c4a265; animation: load 1.1s ease-in-out infinite alternate; }
  @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
</style>
</head>
<body>
<main>
  <h1>Loading Carousel Prompt Studio V4</h1>
  <p>The full fixed V4 app is loading from the repository payload.</p>
  <div class="bar"><div class="fill"></div></div>
</main>
<script>
(async function () {
  const files = [
    'payload/v4-00.txt','payload/v4-01.txt','payload/v4-02.txt','payload/v4-03.txt','payload/v4-04.txt',
    'payload/v4-05.txt','payload/v4-06.txt','payload/v4-07.txt','payload/v4-08.txt','payload/v4-09.txt'
  ];

  async function loadText(path) {
    const response = await fetch(path, { cache: 'no-store' });
    if (!response.ok) throw new Error('Could not load ' + path);
    return response.text();
  }

  try {
    if (!('DecompressionStream' in window)) {
      throw new Error('This browser does not support DecompressionStream. Please use current Chrome, Edge, or Firefox.');
    }
    const encoded = (await Promise.all(files.map(loadText))).join('').replace(/\s+/g, '');
    const binary = atob(encoded);
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    document.body.innerHTML = '<main><h1>Could not load Carousel Prompt Studio V4</h1><p>' + String(error.message || error) + '</p></main>';
    console.error(error);
  }
})();
</script>
</body>
</html>
